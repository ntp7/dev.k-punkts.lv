<!DOCTYPE html>
<html lang="lv">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>K-PUNKTS foto spēle | Iesniegumi</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#252525;font-family:Arial,sans-serif}
    header{padding:18px 22px;background:#353535;color:#fff}h1{margin:0 0 8px;font-size:24px}
    #stats{color:#ddd}.toolbar{padding:12px 18px;background:#fff;border-bottom:1px solid #ddd}
    input{width:min(100%,420px);padding:10px;border:1px solid #bbb;border-radius:5px;font-size:15px}
    .wrap{overflow-x:auto}table{width:100%;min-width:900px;border-collapse:collapse;background:#fff}
    th,td{padding:11px 12px;border-bottom:1px solid #ddd;text-align:left}th{background:#e8e8e8}
    tbody tr:hover{background:#eee}.mapping{white-space:nowrap}.error{padding:14px;color:#a02020}
    .yes{color:#267a3f;font-weight:bold}.muted{color:#777}
  </style>
</head>
<body>
<header><h1>K-PUNKTS foto spēles iesniegumi</h1><div id="stats">Ielādē…</div></header>
<div class="toolbar"><input id="search" placeholder="Meklēt komandu…"></div>
<div id="error" class="error"></div>
<div class="wrap"><table>
  <thead><tr><th>Nr.</th><th>Komanda</th><th>Dalībnieki</th><th>A</th><th>B</th><th>C</th><th>D</th><th>E</th><th>F</th><th>G</th><th>H</th><th>I</th><th>J</th><th>Pareizi</th><th>Jaunumi</th><th>E-pasts</th><th>Iesniegts</th></tr></thead>
  <tbody id="rows"></tbody>
</table></div>
<script type="module">
  import {initializeApp} from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
  import {getFirestore,collection,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";
  const firebaseConfig={apiKey:"AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",authDomain:"kpunkts-617f1.firebaseapp.com",projectId:"kpunkts-617f1",storageBucket:"kpunkts-617f1.appspot.com",messagingSenderId:"402643964732",appId:"1:402643964732:web:5d15d7317ace4554a94439"};
  const COLLECTION_NAME="kpFotoSpele2026";
  const letters="ABCDEFGHIJ".split("");
  const correctAnswers={A:3,B:5,C:7,D:10,E:1,F:6,G:9,H:2,I:4,J:8};
  const getScore=answers=>letters.reduce(
    (score,letter)=>score+(Number(answers?.[letter])===correctAnswers[letter]?1:0),
    0
  );
  const safe=value=>String(value??"—").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
  const formatTime=value=>value?.toDate?new Intl.DateTimeFormat("lv-LV",{dateStyle:"short",timeStyle:"short",timeZone:"Europe/Riga"}).format(value.toDate()):"—";
  const rows=document.getElementById("rows");
  try{
    const snapshot=await getDocs(query(collection(getFirestore(initializeApp(firebaseConfig)),COLLECTION_NAME),orderBy("submissionTime","asc")));
    const data=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
    rows.innerHTML=data.map((item,index)=>`<tr data-search="${safe(item.teamName).toLowerCase()}">
      <td>${index+1}</td><td><strong>${safe(item.teamName)}</strong></td><td>${safe(item.participantCount)}</td>
      ${letters.map(letter=>`<td class="mapping">KP${safe(item.answers?.[letter])}</td>`).join("")}
      <td><strong>${getScore(item.answers)}/10</strong></td>
      <td class="${item.newsletter?'yes':'muted'}">${item.newsletter?'Jā':'Nē'}</td><td>${safe(item.email)}</td><td>${formatTime(item.submissionTime)}</td>
    </tr>`).join("");
    const perfectScores=data.filter(item=>getScore(item.answers)===10).length;
    document.getElementById("stats").textContent=`Komandas: ${data.length} · Dalībnieki kopā: ${data.reduce((sum,item)=>sum+Number(item.participantCount||0),0)} · Visas atbildes pareizas: ${perfectScores}`;
  }catch(error){document.getElementById("error").textContent=`Neizdevās ielādēt datus: ${error.code||error.message}`;}
  document.getElementById("search").addEventListener("input",event=>{
    const term=event.target.value.trim().toLowerCase();
    [...rows.children].forEach(row=>row.hidden=!row.dataset.search.includes(term));
  });
</script>
</body>
</html>
