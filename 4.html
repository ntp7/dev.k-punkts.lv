<!DOCTYPE html>
<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Finišs - 100km dalībniekiem</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <h1>
        Finišs (100km dalībniekiem) - viesu mājas Satekas
    </h1>


    <div id="participants-container">

        <!-- Unregistered participants -->
        <div id="participants-box">

            <h2>
                Unregistered Participants
            </h2>

        </div>


        <!-- Registered participants -->
        <div id="registered-box">

            <h2>
                Registered Participants
            </h2>

        </div>

    </div>



<script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";


    // Normal Firebase WEB configuration.
    // Safe to expose in frontend code.
    const firebaseConfig = {

        apiKey:
            "AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",

        authDomain:
            "kpunkts-617f1.firebaseapp.com",

        projectId:
            "kpunkts-617f1",

        storageBucket:
            "kpunkts-617f1.appspot.com",

        messagingSenderId:
            "402643964732",

        appId:
            "1:402643964732:web:5d15d7317ace4554a94439"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);


    // =========================================================
    // PUBLIC COLLECTION
    // =========================================================
    //
    // This page ONLY accesses:
    //
    // pieteikums100km2026_public
    //
    // It NEVER accesses:
    //
    // pieteikums100km2026
    //
    // =========================================================

    const PUBLIC_COLLECTION =
        "pieteikums100km2026_public";


    // =========================================================
    // FETCH PARTICIPANTS
    // =========================================================

    async function fetchParticipants() {

        const participantsBox =
            document.getElementById(
                "participants-box"
            );


        const registeredBox =
            document.getElementById(
                "registered-box"
            );


        participantsBox.innerHTML =
            "<h2>Unregistered Participants</h2>";


        registeredBox.innerHTML =
            "<h2>Registered Participants</h2>";


        try {

            // -------------------------------------------------
            // READ ONLY PUBLIC COLLECTION
            // -------------------------------------------------

            const querySnapshot =
                await getDocs(
                    collection(
                        db,
                        PUBLIC_COLLECTION
                    )
                );


            const participants = [];


            querySnapshot.forEach(
                (docSnapshot) => {

                    const data =
                        docSnapshot.data();


                    // Don't display hidden participants.
                    if (
                        data.hide === true
                    ) {

                        return;

                    }


                    // Don't display participants
                    // who have withdrawn.
                    if (
                        data.izstajies === true
                    ) {

                        return;

                    }


                    // -------------------------------------------------
                    // ONLY 100 KM PARTICIPANTS
                    // -------------------------------------------------

                    const distance =
                        normalizeDistance(
                            data.distance
                        );


                    if (
                        distance !== 100
                    ) {

                        return;

                    }


                    participants.push({

                        ...data,

                        id:
                            docSnapshot.id

                    });

                }
            );


            // -------------------------------------------------
            // SORT BY SURNAME
            // -------------------------------------------------

            participants.sort(
                (a, b) => {

                    return (
                        (a.uzvards || "")
                            .localeCompare(
                                b.uzvards || "",
                                "lv"
                            )
                    );

                }
            );


            // -------------------------------------------------
            // DISPLAY
            // -------------------------------------------------

            participants.forEach(
                (participant) => {

                    const participantDiv =
                        createParticipantDiv(
                            participant,
                            Boolean(
                                participant.finiss
                            ),
                            participant.id
                        );


                    if (
                        participant.finiss
                    ) {

                        registeredBox.appendChild(
                            participantDiv
                        );

                    } else {

                        participantsBox.appendChild(
                            participantDiv
                        );

                    }

                }
            );


        } catch (error) {

            console.error(
                "Error fetching public participants:",
                error
            );


            participantsBox.innerHTML += `
                <p>
                    Neizdevās ielādēt dalībniekus.
                </p>
            `;

        }

    }



    // =========================================================
    // NORMALIZE DISTANCE
    // =========================================================

    function normalizeDistance(
        distance
    ) {

        if (
            distance === null ||
            distance === undefined
        ) {

            return null;

        }


        const normalized =
            String(distance)
                .toLowerCase()
                .replace(
                    /\s+/g,
                    ""
                );


        if (
            normalized.includes("100") &&
            normalized.includes("km")
        ) {

            return 100;

        }


        if (
            /^100$/.test(
                normalized.replace(
                    "km",
                    ""
                )
            )
        ) {

            return 100;

        }


        const match =
            normalized.match(
                /(\d+)/
            );


        return match
            ? Number(match[1])
            : null;

    }



    // =========================================================
    // CREATE PARTICIPANT
    // =========================================================

    function createParticipantDiv(
        data,
        isRegistered,
        docId
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.classList.add(
            "participant"
        );


        // -------------------------------------------------
        // NAME
        // -------------------------------------------------

        const name =
            document.createElement(
                "strong"
            );


        name.textContent =
            `${data.uzvards || ""} ${data.vards || ""}`;


        div.appendChild(
            name
        );


        // -------------------------------------------------
        // FINISHED
        // -------------------------------------------------

        if (isRegistered) {

            const finissContainer =
                document.createElement(
                    "div"
                );


            finissContainer.style.display =
                "flex";


            finissContainer.style.alignItems =
                "center";


            const finissSpan =
                document.createElement(
                    "span"
                );


            finissSpan.textContent =
                `(${data.finiss})`;


            finissSpan.style.marginRight =
                "10px";


            finissContainer.appendChild(
                finissSpan
            );


            finissContainer.appendChild(
                createRemoveButton(
                    docId
                )
            );


            div.appendChild(
                finissContainer
            );


        } else {

            // -------------------------------------------------
            // NOT FINISHED
            // -------------------------------------------------

            div.appendChild(
                createRegisterButton(
                    docId
                )
            );

        }


        return div;

    }



    // =========================================================
    // REGISTER FINISH
    // =========================================================

    async function registerParticipant(
        docId,
        participantDiv
    ) {

        const now =
            new Date();


        // -------------------------------------------------
        // FORMAT:
        // DD/MM/YYYY HH:mm:ss
        // -------------------------------------------------

        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const year =
            now.getFullYear();


        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        const seconds =
            String(
                now.getSeconds()
            ).padStart(
                2,
                "0"
            );


        const currentTime =
            `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;


        try {

            // -------------------------------------------------
            // UPDATE ONLY PUBLIC DOCUMENT
            // -------------------------------------------------

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    finiss: currentTime
                }
            );


            // -------------------------------------------------
            // UPDATE UI
            // -------------------------------------------------

            const registeredBox =
                document.getElementById(
                    "registered-box"
                );


            const oldButton =
                participantDiv.querySelector(
                    "button"
                );


            if (oldButton) {

                oldButton.remove();

            }


            const finissContainer =
                document.createElement(
                    "div"
                );


            finissContainer.style.display =
                "flex";


            finissContainer.style.alignItems =
                "center";


            const finissSpan =
                document.createElement(
                    "span"
                );


            finissSpan.textContent =
                `(${currentTime})`;


            finissSpan.style.marginRight =
                "10px";


            finissContainer.appendChild(
                finissSpan
            );


            finissContainer.appendChild(
                createRemoveButton(
                    docId
                )
            );


            participantDiv.appendChild(
                finissContainer
            );


            registeredBox.appendChild(
                participantDiv
            );


        } catch (error) {

            console.error(
                "Error updating finish:",
                error
            );


            alert(
                "Neizdevās reģistrēt finišu. Pārbaudiet piekļuves tiesības."
            );

        }

    }



    // =========================================================
    // REMOVE FINISH
    // =========================================================

    async function removeRegistration(
        docId
    ) {

        try {

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    finiss: ""
                }
            );


            // Reload list.

            await fetchParticipants();


        } catch (error) {

            console.error(
                "Error removing finish:",
                error
            );


            alert(
                "Neizdevās noņemt finiša laiku."
            );

        }

    }



    // =========================================================
    // REGISTER BUTTON
    // =========================================================

    function createRegisterButton(
        docId
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            "Register";


        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;


                await registerParticipant(
                    docId,
                    button.closest(
                        ".participant"
                    )
                );

            }
        );


        return button;

    }



    // =========================================================
    // REMOVE BUTTON
    // =========================================================

    function createRemoveButton(
        docId
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            "Remove";


        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;


                await removeRegistration(
                    docId
                );

            }
        );


        return button;

    }



    // =========================================================
    // START
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        fetchParticipants
    );

</script>

</body>

</html>
