
<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>K-Punkts Developer</title>

<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&display=swap" rel="stylesheet">

<style>
    * {
        box-sizing: border-box;
    }

    body {
        background: #0f0f0f;
        color: #ffffff;
        font-family: 'Oswald', sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 0;
    }

    .main-container {
        background: transparent;
        border: none;
        border-radius: 0;
        padding: 0;
        width: 100%;
        max-width: 500px;
        text-align: center;
        box-shadow: none;
    }

    .logo {
        width: 90px;
        height: auto;
        margin-bottom: 15px;
    }

    h1 {
        font-size: 3rem;
        margin: 0 0 30px 0;
        letter-spacing: 1px;
        line-height: 1.1;
    }

    .button {
        width: 100%;
        padding: 16px;
        margin: 8px 0;

        border: none;
        border-radius: 12px;

        background: #ff8c00;
        color: white;

        font-family: inherit;
        font-size: 1.4rem;

        cursor: pointer;

        transition: all 0.2s ease;
    }

    .button:hover {
        filter: brightness(1.05);
    }

    .button:active {
        filter: brightness(0.95);
    }

    .danger {
        background: #3b1515;
        color: #ff5555;
        margin-top: 25px;
    }

    .info {
        background: #16384d;
        color: #4dd8ff;
    }

    @media (max-width: 600px) {
        .main-container {
            padding: 25px;
        }

        h1 {
            font-size: 2.2rem;
        }

        .button {
            font-size: 1.2rem;
        }
    }

    /* Modal */

    #passwordModal {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        align-items: center;
        justify-content: center;
        z-index: 2000;
    }

    #passwordModalContent {
        background: #222;
        padding: 30px;
        border-radius: 15px;
        text-align: center;
        width: 90%;
        max-width: 400px;
    }

    #passwordModalContent h2 {
        margin-top: 0;
    }

    #passwordModalContent input {
        width: 100%;
        padding: 12px;
        font-size: 1rem;
        border: none;
        border-radius: 8px;
        margin-bottom: 20px;
    }

    #submitPassword,
    #cancelPassword {
        border: none;
        padding: 12px 18px;
        border-radius: 8px;
        cursor: pointer;
        font-size: 1rem;
    }

    #submitPassword {
        background: #00d5ff;
        color: black;
    }

    #cancelPassword {
        background: #d62828;
        color: white;
        margin-left: 10px;
    }
</style>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        closePasswordModal();
    });

    function navigateToKP(selectedValue) {
        window.location.href =
            `https://dev.k-punkts.lv/${selectedValue}.html`;
    }

    function navigateToIzstasanas() {
        window.location.href =
            'https://dev.k-punkts.lv/izstasanas.html';
    }

    const correctPassword = "bajari23";

    function showPasswordModal() {
        document.getElementById("passwordModal").style.display = "flex";
    }

    function closePasswordModal() {
        document.getElementById("passwordModal").style.display = "none";
        document.getElementById("passwordInput").value = "";
    }

    function checkPassword() {
        const input =
            document.getElementById("passwordInput").value;

        if (input === correctPassword) {
            window.location.href =
                'https://dev.k-punkts.lv/k100dprivate2025.html';

            closePasswordModal();
        } else {
            alert("Nepareiza parole!");
        }
    }
</script>
</head>

<body>

<div class="main-container">

    <img src="logo.png" class="logo" alt="Logo">

    <h1>DALĪBNIEKU REĢISTRĀCIJA</h1>

    <button class="button" onclick="navigateToKP(1)">
        KP1
    </button>

    <button class="button" onclick="navigateToKP(2)">
        KP2 / Finišs
    </button>

    <button class="button" onclick="navigateToKP(3)">
        KP3
    </button>

    <button class="button" onclick="navigateToKP(4)">
        Finišs
    </button>

    <button class="button danger"
            onclick="navigateToIzstasanas()">
        Izstāšanās
    </button>

    <button class="button info"
            onclick="window.location.href='https://k-punkts.lv/rezultati';">
        Rezultātu tabula
    </button>

</div>

<!-- Password Modal -->

<div id="passwordModal">
    <div id="passwordModalContent">

        <h2>Ievadiet paroli</h2>

        <input
            id="passwordInput"
            type="password"
            placeholder="Parole">

        <br>

        <button
            id="submitPassword"
            onclick="checkPassword()">
            Iesniegt
        </button>

        <button
            id="cancelPassword"
            onclick="closePasswordModal()">
            Atcelt
        </button>

    </div>
</div>

</body>
</html>
