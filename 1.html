<!DOCTYPE html>
<html lang="lv">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KP1 - Iecavas kultūras nams</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>


<body>

    <h1>KP1 - Iecavas kultūras nams</h1>


    <div id="participants-container">

        <!-- UNREGISTERED -->
        <div id="participants-box">

            <h2>
                Unregistered Participants
            </h2>

        </div>


        <!-- REGISTERED -->
        <div id="registered-box">

            <h2>
                Registered Participants
            </h2>

        </div>

    </div>



<script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";


    // Normal Firebase WEB configuration.
    // This is frontend configuration and is safe to expose.
    const firebaseConfig = {

        apiKey:
            "AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",

        authDomain:
            "kpunkts-617f1.firebaseapp.com",

        projectId:
            "kpunkts-617f1",

        storageBucket:
            "kpunkts-617f1.appspot.com",

        messagingSenderId:
            "402643964732",

        appId:
            "1:402643964732:web:5d15d7317ace4554a94439"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);




    const PUBLIC_COLLECTION =
        "pieteikumsBrivibas2026_public";



    // =========================================================
    // FETCH PARTICIPANTS
    // =========================================================

    async function fetchParticipants() {

        const participantsBox =
            document.getElementById(
                "participants-box"
            );


        const registeredBox =
            document.getElementById(
                "registered-box"
            );


        participantsBox.innerHTML =
            "<h2>Unregistered Participants</h2>";


        registeredBox.innerHTML =
            "<h2>Registered Participants</h2>";


        try {

            // -----------------------------------------------------
            // READ ONLY PUBLIC COLLECTION
            // -----------------------------------------------------

            const querySnapshot =
                await getDocs(
                    collection(
                        db,
                        PUBLIC_COLLECTION
                    )
                );


            const participants = [];


            querySnapshot.forEach(
                (docSnapshot) => {

                    const data =
                        docSnapshot.data();


                    // Hide participant if requested.
                    if (
                        data.hide === true
                    ) {
                        return;
                    }


                    // Do not show participants who have left.
                    if (
                        data.izstajies === true
                    ) {
                        return;
                    }


                    const docId =
                        docSnapshot.id;


                    participants.push({

                        ...data,

                        id: docId

                    });

                }
            );


            // -----------------------------------------------------
            // SORT BY SURNAME
            // -----------------------------------------------------

            participants.sort(
                (a, b) => {

                    return (
                        (a.uzvards || "")
                            .localeCompare(
                                b.uzvards || "",
                                "lv"
                            )
                    );

                }
            );


            // -----------------------------------------------------
            // DISPLAY
            // -----------------------------------------------------

            participants.forEach(
                (participant) => {

                    const participantDiv =
                        createParticipantDiv(
                            participant,
                            Boolean(
                                participant.KP1
                            ),
                            participant.id
                        );


                    if (
                        participant.KP1
                    ) {

                        registeredBox.appendChild(
                            participantDiv
                        );

                    } else {

                        participantsBox.appendChild(
                            participantDiv
                        );

                    }

                }
            );


        } catch (error) {

            console.error(
                "Error fetching public participants:",
                error
            );


            participantsBox.innerHTML += `
                <p>
                    Neizdevās ielādēt dalībniekus.
                </p>
            `;

        }

    }



    // =========================================================
    // CREATE PARTICIPANT
    // =========================================================

    function createParticipantDiv(
        data,
        isRegistered,
        docId
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.classList.add(
            "participant"
        );


        // -----------------------------------------------------
        // NAME
        // -----------------------------------------------------

        const name =
            document.createElement(
                "strong"
            );


        name.textContent =
            `${data.uzvards || ""} ${data.vards || ""}`;


        div.appendChild(
            name
        );


        // -----------------------------------------------------
        // REGISTERED
        // -----------------------------------------------------

        if (isRegistered) {


            const kp1Container =
                document.createElement(
                    "div"
                );


            kp1Container.style.display =
                "flex";


            kp1Container.style.alignItems =
                "center";


            // KP1 TIME

            const kp1Span =
                document.createElement(
                    "span"
                );


            kp1Span.textContent =
                `(${data.KP1})`;


            kp1Span.style.marginRight =
                "10px";


            kp1Container.appendChild(
                kp1Span
            );


            // REMOVE BUTTON

            kp1Container.appendChild(
                createRemoveButton(
                    docId,
                    div
                )
            );


            div.appendChild(
                kp1Container
            );


        } else {


            // -------------------------------------------------
            // NOT REGISTERED
            // -------------------------------------------------

            div.appendChild(
                createRegisterButton(
                    docId,
                    div
                )
            );

        }


        return div;

    }



    // =========================================================
    // REGISTER PARTICIPANT
    // =========================================================

    async function registerParticipant(
        docId,
        participantDiv
    ) {

        const now =
            new Date();


        // -----------------------------------------------------
        // FORMAT TIME
        // DD/MM/YYYY HH:mm:ss
        // -----------------------------------------------------

        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const year =
            now.getFullYear();


        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        const seconds =
            String(
                now.getSeconds()
            ).padStart(
                2,
                "0"
            );


        const currentTime =
            `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;


        try {

            // -------------------------------------------------
            // UPDATE PUBLIC COLLECTION
            // -------------------------------------------------

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    KP1: currentTime
                }
            );


            // -------------------------------------------------
            // UPDATE UI
            // -------------------------------------------------

            const registeredBox =
                document.getElementById(
                    "registered-box"
                );


            const registerButton =
                participantDiv.querySelector(
                    "button"
                );


            if (registerButton) {

                registerButton.remove();

            }


            const kp1Container =
                document.createElement(
                    "div"
                );


            kp1Container.style.display =
                "flex";


            kp1Container.style.alignItems =
                "center";


            const kp1Span =
                document.createElement(
                    "span"
                );


            kp1Span.textContent =
                `(${currentTime})`;


            kp1Span.style.marginRight =
                "10px";


            kp1Container.appendChild(
                kp1Span
            );


            kp1Container.appendChild(
                createRemoveButton(
                    docId,
                    participantDiv
                )
            );


            participantDiv.appendChild(
                kp1Container
            );


            registeredBox.appendChild(
                participantDiv
            );


        } catch (error) {

            console.error(
                "Error updating public participant:",
                error
            );


            alert(
                "Neizdevās reģistrēt dalībnieku. Pārbaudiet piekļuves tiesības."
            );

        }

    }



    // =========================================================
    // REMOVE REGISTRATION
    // =========================================================

    async function removeRegistration(
        docId,
        participantDiv
    ) {

        try {

            // -------------------------------------------------
            // REMOVE KP1 FROM PUBLIC COLLECTION
            // -------------------------------------------------

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    KP1: ""
                }
            );


            // -------------------------------------------------
            // RELOAD UI
            // -------------------------------------------------

            await fetchParticipants();


        } catch (error) {

            console.error(
                "Error removing registration:",
                error
            );


            alert(
                "Neizdevās noņemt KP1."
            );

        }

    }



    // =========================================================
    // REGISTER BUTTON
    // =========================================================

    function createRegisterButton(
        docId,
        participantDiv
    ) {

        const registerButton =
            document.createElement(
                "button"
            );


        registerButton.textContent =
            "Register";


        registerButton.type =
            "button";


        registerButton.addEventListener(
            "click",
            () => {

                registerButton.disabled =
                    true;


                registerParticipant(
                    docId,
                    participantDiv
                );

            }
        );


        return registerButton;

    }



    // =========================================================
    // REMOVE BUTTON
    // =========================================================

    function createRemoveButton(
        docId,
        participantDiv
    ) {

        const removeButton =
            document.createElement(
                "button"
            );


        removeButton.textContent =
            "Remove";


        removeButton.type =
            "button";


        removeButton.addEventListener(
            "click",
            () => {

                removeButton.disabled =
                    true;


                removeRegistration(
                    docId,
                    participantDiv
                );

            }
        );


        return removeButton;

    }



    // =========================================================
    // START
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        fetchParticipants
    );

</script>

</body>

</html>
