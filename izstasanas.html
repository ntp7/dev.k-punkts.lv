<!DOCTYPE html>
<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dalībnieka izstāšanās</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <h1>
        Ja dalībnieks izstājas no pārgājiena, atzīmē šeit
    </h1>


    <div id="participants-container">

        <!-- =====================================================
             PARTICIPANTS WHO HAVE NOT WITHDRAWN
             ===================================================== -->

        <div id="participants-box">

            <h2>
                Participants
            </h2>

        </div>


        <!-- =====================================================
             PARTICIPANTS WHO HAVE WITHDRAWN
             ===================================================== -->

        <div id="registered-box">

            <h2>
                Izstājušies
            </h2>

        </div>

    </div>



<script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";


    // Normal Firebase WEB configuration.
    // Safe to expose in frontend code.
    const firebaseConfig = {

        apiKey:
            "AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",

        authDomain:
            "kpunkts-617f1.firebaseapp.com",

        projectId:
            "kpunkts-617f1",

        storageBucket:
            "kpunkts-617f1.appspot.com",

        messagingSenderId:
            "402643964732",

        appId:
            "1:402643964732:web:5d15d7317ace4554a94439"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);




    const PUBLIC_COLLECTION =
        "pieteikumsBrivibas2026_public";


    // =========================================================
    // FETCH PARTICIPANTS
    // =========================================================

    async function fetchParticipants() {

        const participantsBox =
            document.getElementById(
                "participants-box"
            );


        const registeredBox =
            document.getElementById(
                "registered-box"
            );


        participantsBox.innerHTML =
            "<h2>Participants</h2>";


        registeredBox.innerHTML =
            "<h2>Izstājušies</h2>";


        try {

            // -------------------------------------------------
            // READ ONLY PUBLIC COLLECTION
            // -------------------------------------------------

            const querySnapshot =
                await getDocs(
                    collection(
                        db,
                        PUBLIC_COLLECTION
                    )
                );


            const participants = [];


            querySnapshot.forEach(
                (docSnapshot) => {

                    const data =
                        docSnapshot.data();


                    // Don't display hidden participants.
                    if (
                        data.hide === true
                    ) {

                        return;

                    }


                    participants.push({

                        ...data,

                        id:
                            docSnapshot.id

                    });

                }
            );


            // -------------------------------------------------
            // SORT BY SURNAME
            // -------------------------------------------------

            participants.sort(
                (a, b) => {

                    return (
                        (a.uzvards || "")
                            .localeCompare(
                                b.uzvards || "",
                                "lv"
                            )
                    );

                }
            );


            // -------------------------------------------------
            // DISPLAY
            // -------------------------------------------------

            participants.forEach(
                (participant) => {

                    const participantDiv =
                        createParticipantDiv(
                            participant,
                            participant.izstajies === true,
                            participant.id
                        );


                    if (
                        participant.izstajies === true
                    ) {

                        registeredBox.appendChild(
                            participantDiv
                        );

                    } else {

                        participantsBox.appendChild(
                            participantDiv
                        );

                    }

                }
            );


        } catch (error) {

            console.error(
                "Error fetching public participants:",
                error
            );


            participantsBox.innerHTML += `
                <p>
                    Neizdevās ielādēt dalībniekus.
                </p>
            `;

        }

    }



    // =========================================================
    // CREATE PARTICIPANT
    // =========================================================

    function createParticipantDiv(
        data,
        isWithdrawn,
        docId
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.classList.add(
            "participant"
        );


        // -------------------------------------------------
        // NAME
        // -------------------------------------------------

        const name =
            document.createElement(
                "strong"
            );


        name.textContent =
            `${data.uzvards || ""} ${data.vards || ""}`;


        div.appendChild(
            name
        );


        // -------------------------------------------------
        // WITHDRAWN
        // -------------------------------------------------

        if (isWithdrawn) {

            const removeButton =
                createRemoveButton(
                    docId,
                    div
                );


            div.appendChild(
                removeButton
            );


        } else {

            // -------------------------------------------------
            // NOT WITHDRAWN
            // -------------------------------------------------

            const registerButton =
                createRegisterButton(
                    docId,
                    div
                );


            div.appendChild(
                registerButton
            );

        }


        return div;

    }



    // =========================================================
    // MARK PARTICIPANT AS WITHDRAWN
    // =========================================================

    async function registerParticipant(
        docId,
        participantDiv
    ) {

        try {

            // -------------------------------------------------
            // UPDATE ONLY THE PUBLIC DOCUMENT
            // -------------------------------------------------

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    izstajies: true
                }
            );


            // -------------------------------------------------
            // RELOAD
            // -------------------------------------------------

            await fetchParticipants();


        } catch (error) {

            console.error(
                "Error marking participant as withdrawn:",
                error
            );


            alert(
                "Neizdevās atzīmēt dalībnieku kā izstājušos. Pārbaudiet piekļuves tiesības."
            );

        }

    }



    // =========================================================
    // REMOVE WITHDRAWAL STATUS
    // =========================================================

    async function removeRegistration(
        docId,
        participantDiv
    ) {

        try {

            // -------------------------------------------------
            // UPDATE ONLY THE PUBLIC DOCUMENT
            // -------------------------------------------------

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    izstajies: false
                }
            );


            // -------------------------------------------------
            // RELOAD
            // -------------------------------------------------

            await fetchParticipants();


        } catch (error) {

            console.error(
                "Error removing withdrawal status:",
                error
            );


            alert(
                "Neizdevās noņemt izstāšanās statusu."
            );

        }

    }



    // =========================================================
    // "IZSTĀJAS" BUTTON
    // =========================================================

    function createRegisterButton(
        docId,
        participantDiv
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            "Izstājas";


        button.style.backgroundColor =
            "red";


        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;


                await registerParticipant(
                    docId,
                    participantDiv
                );

            }
        );


        return button;

    }



    // =========================================================
    // REMOVE BUTTON
    // =========================================================

    function createRemoveButton(
        docId,
        participantDiv
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            "Remove";


        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;


                await removeRegistration(
                    docId,
                    participantDiv
                );

            }
        );


        return button;

    }



    // =========================================================
    // START
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        fetchParticipants
    );

</script>

</body>

</html>
