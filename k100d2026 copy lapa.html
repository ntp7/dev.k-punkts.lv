<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0;
            margin: 0;
        }
        h1 {
            background: linear-gradient(to right, #48c977, #1e4922);
            color: white;
            padding: 10px 20px;
            text-align: left;
            margin: 0;
            box-sizing: border-box;
            font-size: 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        h1 img {
            height: 50px;
            width: auto;
            align-self: center;
        }
        .header-content {
            display: flex;
            align-items: center;
            flex-grow: 1;
            justify-content: space-between;
        }
        .header-collumn {
            display: grid;
            grid-template-columns: max-content max-content;
            row-gap: 5px;
            column-gap: 30px;
            font-size: 14px;
            margin-left: 20px;
            padding-right: 20px;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
            text-align: left;
            table-layout: auto;
        }
        th, td {
            padding: 8px 10px;
            border: 1px solid #d0d0d0;
            white-space: nowrap;
        }
        th {
            background-color: #f2f2f2;
            font-size: 13px;
        }
        tr:hover {
            background-color: #f5f5f5;
        }
        .table-note {
            padding: 10px 12px;
            font-size: 13px;
            color: #444;
        }
        input[type="checkbox"] {
            cursor: pointer;
        }
        @media only screen and (max-width: 600px) {
            h1{
                width: 1800px;
            }
            table{
                width:1800px
            }
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";
        import { getAnalytics } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-analytics.js";

        import firebaseConfig from './firebaseconfig.js';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const analytics = getAnalytics(app);

        document.addEventListener('DOMContentLoaded', async () => {
            const tableBody = document.querySelector('#participants-table tbody');

            try {
                const q = query(collection(db, 'pieteikums100km2026'), orderBy('submissionTime'));
                const querySnapshot = await getDocs(q);
                const participants = [];

                querySnapshot.forEach((docSnapshot) => {
                    const data = docSnapshot.data();
                    if (data.hide) return;
                    participants.push(data);
                });

                participants.sort((a, b) => {
                    const surnameA = (a.uzvards || '').trim().toLowerCase();
                    const surnameB = (b.uzvards || '').trim().toLowerCase();
                    return surnameA.localeCompare(surnameB);
                });

                participants.forEach((data) => {
                    const row = document.createElement('tr');

                    row.innerHTML = `
                        <td>${data.vards || ''}</td>
                        <td>${data.uzvards || ''}</td>
                        <td>${data.birthday || ''}</td>
                        <td>${data.sekot || ''}</td>
                        <td>${data.distance || ''}</td>
                        <td>${data.gultasvieta || ''}</td>
                    `;

                    tableBody.appendChild(row);
                });

            } catch (error) {
                console.error("Error getting documents: ", error);
            }
        });
    </script>
</head>

<body>
<h1>
    <div class="header-content">
        <span>
            Dalībnieku saraksts
            <span style="font-size: 18px; color: rgb(202, 255, 159);padding-left: 15px">
                K-100 2026
            </span>
        </span>
    </div>

    <img src="logo.png" alt="Kpunkts Logo">
</h1>

<div class="table-note">Izvēlieties visu tabulu un kopējiet to uz Excel.</div>

<table id="participants-table">
    <thead>
        <tr>
            <th>Vārds</th>
            <th>Uzvārds</th>
            <th>Dzimšanas diena</th>
            <th>Sekot</th>
            <th>Distance</th>
            <th>Gultasvieta</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

</body>
</html>
