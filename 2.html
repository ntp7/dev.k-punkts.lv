<!DOCTYPE html>
<html lang="lv">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>KP2 - viesu mājas Satekas</title>

    <link
        rel="stylesheet"
        href="styles.css"
    >

</head>


<body>

    <h1>
        KP2 - viesu mājas Satekas
        (Finišs 50km dalībniekiem)
    </h1>


    <div id="participants-container">

        <!-- Unregistered -->
        <div id="participants-box">

            <h2>
                Unregistered Participants
            </h2>

        </div>


        <!-- Registered -->
        <div id="registered-box">

            <h2>
                Registered Participants
            </h2>

        </div>

    </div>



<script type="module">

    // =========================================================
    // FIREBASE
    // =========================================================

    import {
        initializeApp
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";


    import {
        getFirestore,
        collection,
        getDocs,
        doc,
        updateDoc
    } from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";


    // Normal Firebase WEB configuration.
    // Safe to expose in frontend code.
    const firebaseConfig = {

        apiKey:
            "AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",

        authDomain:
            "kpunkts-617f1.firebaseapp.com",

        projectId:
            "kpunkts-617f1",

        storageBucket:
            "kpunkts-617f1.appspot.com",

        messagingSenderId:
            "402643964732",

        appId:
            "1:402643964732:web:5d15d7317ace4554a94439"

    };


    const app =
        initializeApp(firebaseConfig);


    const db =
        getFirestore(app);



    const PUBLIC_COLLECTION =
        "pieteikumsBrivibas2026_public";


    // =========================================================
    // FETCH PARTICIPANTS
    // =========================================================

    async function fetchParticipants() {

        const participantsBox =
            document.getElementById(
                "participants-box"
            );


        const registeredBox =
            document.getElementById(
                "registered-box"
            );


        participantsBox.innerHTML =
            "<h2>Unregistered Participants</h2>";


        registeredBox.innerHTML =
            "<h2>Registered Participants</h2>";


        try {

            const querySnapshot =
                await getDocs(
                    collection(
                        db,
                        PUBLIC_COLLECTION
                    )
                );


            const participants = [];


            querySnapshot.forEach(
                (docSnapshot) => {

                    const data =
                        docSnapshot.data();


                    // Don't display hidden participants.
                    if (
                        data.hide === true
                    ) {
                        return;
                    }


                    // Don't display participants
                    // who have already withdrawn.
                    if (
                        data.izstajies === true
                    ) {
                        return;
                    }


                    participants.push({

                        ...data,

                        id:
                            docSnapshot.id

                    });

                }
            );


            // Sort by surname.

            participants.sort(
                (a, b) => {

                    return (
                        (a.uzvards || "")
                            .localeCompare(
                                b.uzvards || "",
                                "lv"
                            )
                    );

                }
            );


            // Display participants.

            participants.forEach(
                (participant) => {

                    const participantDiv =
                        createParticipantDiv(
                            participant,
                            Boolean(
                                participant.KP2
                            ),
                            participant.id
                        );


                    if (
                        participant.KP2
                    ) {

                        registeredBox.appendChild(
                            participantDiv
                        );

                    } else {

                        participantsBox.appendChild(
                            participantDiv
                        );

                    }

                }
            );


        } catch (error) {

            console.error(
                "Error fetching public participants:",
                error
            );


            participantsBox.innerHTML += `
                <p>
                    Neizdevās ielādēt dalībniekus.
                </p>
            `;

        }

    }


    // =========================================================
    // CREATE PARTICIPANT ELEMENT
    // =========================================================

    function createParticipantDiv(
        data,
        isRegistered,
        docId
    ) {

        const div =
            document.createElement(
                "div"
            );


        div.classList.add(
            "participant"
        );


        // Name and surname are inserted using textContent.

        const name =
            document.createElement(
                "strong"
            );


        name.textContent =
            `${data.uzvards || ""} ${data.vards || ""}`;


        div.appendChild(
            name
        );


        // =====================================================
        // REGISTERED
        // =====================================================

        if (isRegistered) {

            const kp2Container =
                document.createElement(
                    "div"
                );


            kp2Container.style.display =
                "flex";


            kp2Container.style.alignItems =
                "center";


            const kp2Span =
                document.createElement(
                    "span"
                );


            kp2Span.textContent =
                `(${data.KP2})`;


            kp2Span.style.marginRight =
                "10px";


            kp2Container.appendChild(
                kp2Span
            );


            kp2Container.appendChild(
                createRemoveButton(
                    docId,
                    div
                )
            );


            div.appendChild(
                kp2Container
            );


        } else {

            // =================================================
            // NOT REGISTERED
            // =================================================

            div.appendChild(
                createRegisterButton(
                    docId,
                    div
                )
            );

        }


        return div;

    }


    // =========================================================
    // REGISTER PARTICIPANT AT KP2
    // =========================================================

    async function registerParticipant(
        docId,
        participantDiv
    ) {

        const now =
            new Date();


        // -----------------------------------------------------
        // DD/MM/YYYY HH:mm:ss
        // -----------------------------------------------------

        const day =
            String(
                now.getDate()
            ).padStart(
                2,
                "0"
            );


        const month =
            String(
                now.getMonth() + 1
            ).padStart(
                2,
                "0"
            );


        const year =
            now.getFullYear();


        const hours =
            String(
                now.getHours()
            ).padStart(
                2,
                "0"
            );


        const minutes =
            String(
                now.getMinutes()
            ).padStart(
                2,
                "0"
            );


        const seconds =
            String(
                now.getSeconds()
            ).padStart(
                2,
                "0"
            );


        const currentTime =
            `${day}/${month}/${year} ${hours}:${minutes}:${seconds}`;


        try {

            // -------------------------------------------------
            // UPDATE ONLY THE PUBLIC DOCUMENT
            // -------------------------------------------------

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    KP2: currentTime
                }
            );


            // -------------------------------------------------
            // UPDATE DISPLAY
            // -------------------------------------------------

            const registeredBox =
                document.getElementById(
                    "registered-box"
                );


            const oldButton =
                participantDiv.querySelector(
                    "button"
                );


            if (oldButton) {
                oldButton.remove();
            }


            const kp2Container =
                document.createElement(
                    "div"
                );


            kp2Container.style.display =
                "flex";


            kp2Container.style.alignItems =
                "center";


            const kp2Span =
                document.createElement(
                    "span"
                );


            kp2Span.textContent =
                `(${currentTime})`;


            kp2Span.style.marginRight =
                "10px";


            kp2Container.appendChild(
                kp2Span
            );


            kp2Container.appendChild(
                createRemoveButton(
                    docId,
                    participantDiv
                )
            );


            participantDiv.appendChild(
                kp2Container
            );


            registeredBox.appendChild(
                participantDiv
            );


        } catch (error) {

            console.error(
                "Error updating KP2:",
                error
            );


            alert(
                "Neizdevās reģistrēt KP2 dalībniekam. Pārbaudiet piekļuves tiesības."
            );

        }

    }


    // =========================================================
    // REMOVE KP2
    // =========================================================

    async function removeRegistration(
        docId
    ) {

        try {

            await updateDoc(
                doc(
                    db,
                    PUBLIC_COLLECTION,
                    docId
                ),
                {
                    KP2: ""
                }
            );


            // Reload everything to keep the UI consistent.

            await fetchParticipants();


        } catch (error) {

            console.error(
                "Error removing KP2:",
                error
            );


            alert(
                "Neizdevās noņemt KP2."
            );

        }

    }


    // =========================================================
    // REGISTER BUTTON
    // =========================================================

    function createRegisterButton(
        docId,
        participantDiv
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            "Register";


        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;


                await registerParticipant(
                    docId,
                    participantDiv
                );

            }
        );


        return button;

    }


    // =========================================================
    // REMOVE BUTTON
    // =========================================================

    function createRemoveButton(
        docId,
        participantDiv
    ) {

        const button =
            document.createElement(
                "button"
            );


        button.type =
            "button";


        button.textContent =
            "Remove";


        button.addEventListener(
            "click",
            async () => {

                button.disabled =
                    true;


                await removeRegistration(
                    docId
                );

            }
        );


        return button;

    }


    // =========================================================
    // LOAD ON PAGE START
    // =========================================================

    document.addEventListener(
        "DOMContentLoaded",
        fetchParticipants
    );

</script>

</body>

</html>
