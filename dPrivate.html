<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brīvības rogainings 2026 — pieteikumi</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;color:#252525;background:#f7f7f7}h1{margin:0;padding:9px 18px;display:flex;align-items:center;justify-content:flex-start;gap:20px;color:#fff;background:linear-gradient(to right,#398411,#252525);font-size:22px}.event-name{display:inline;margin-left:10px;color:#bcbbba;font-size:15px;font-weight:normal}.header-stats{display:flex;align-items:center;gap:0;margin-left:8px;font-size:12px}.stat-group{min-width:135px;padding:0 14px;background:transparent}.stat-group+.stat-group{border-left:1px solid rgba(255,255,255,.3)}.stat-title{margin-bottom:2px;color:#fff;font-size:10px;font-weight:bold;letter-spacing:.5px;text-transform:uppercase}.stat-line{display:grid;grid-template-columns:1fr auto;gap:12px;margin:1px 0;color:#fff}.stat-value{font-weight:bold;color:#fff}#search-bar{width:100%;padding:12px 15px;border:0;border-bottom:1px solid #ccc;font-size:16px}.table-wrapper{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{width:100%;min-width:1380px;border-collapse:collapse;background:#fff;font-size:16px;text-align:left}th,td{padding:12px;border-bottom:1px solid #ddd;vertical-align:middle}th{background:#ededed}.team-row{background:#f5f5f5;cursor:pointer}.team-row:hover,.team-row.open{background:#dedede}.team-name{font-weight:bold}.municipality{font-weight:500}.discount-code{color:#267a3f;font-weight:bold}.participant-row{display:none;background:#fff}.participant-row>td{padding:0 12px}.participant-details{display:grid;grid-template-columns:80px 115px 125px 120px 70px 90px 95px 110px 110px minmax(170px,1fr);gap:14px;align-items:center;min-width:1220px;padding:9px 12px;font-size:14px}.participant-label{display:block;margin-bottom:2px;color:#888;font-size:10px;text-transform:uppercase;letter-spacing:.25px}@media(max-width:1100px){h1{align-items:center;flex-direction:row;gap:12px;overflow-x:auto;white-space:nowrap;-webkit-overflow-scrolling:touch}h1>span{flex:0 0 auto}.event-name{display:inline;margin-left:7px}.header-stats{flex:0 0 auto;width:auto;margin-left:0}.stat-group{flex:0 0 auto;min-width:120px;padding:0 10px}}@media(max-width:700px){h1{padding:7px 8px;gap:4px;font-size:16px}h1>span{line-height:1.1}.event-name{display:block;margin:3px 0 0;font-size:11px}.header-stats{display:flex;margin-left:0;font-size:11px}.stat-group{min-width:auto;padding:0 5px}.stat-group:first-child{min-width:112px}.stat-group+.stat-group{min-width:62px;border-left:1px solid rgba(255,255,255,.3);border-top:0}.stat-line{gap:4px}.stat-title{font-size:9px}}
</style>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/9.1.3/firebase-app.js";
import {getFirestore,collection,getDocs,query,orderBy} from "https://www.gstatic.com/firebasejs/9.1.3/firebase-firestore.js";
// Firebase web configuration is safe to include in frontend code.
// Access to Firestore data must be controlled with Firestore Rules.
const firebaseConfig={
    apiKey:"AIzaSyBMb0jBPIDPdKJhvw8EdTT8zDIjmh9n4Uk",
    authDomain:"kpunkts-617f1.firebaseapp.com",
    projectId:"kpunkts-617f1",
    storageBucket:"kpunkts-617f1.appspot.com",
    messagingSenderId:"402643964732",
    appId:"1:402643964732:web:5d15d7317ace4554a94439"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);

function safe(value){
    if(value===null||value===undefined||value==="")return "—";
    return String(value).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#039;");
}
function money(value){return `${Number(value||0).toFixed(2)} EUR`;}
function gender(value){return {virietis:"Vīrietis",sieviete:"Sieviete",other:"Cits"}[value]||value||"—";}
function submissionTime(value){
    if(!value)return "—";
    const date=typeof value.toDate==="function"?value.toDate():new Date(value);
    if(Number.isNaN(date.getTime()))return "—";
    return new Intl.DateTimeFormat("lv-LV",{
        timeZone:"Europe/Riga",
        year:"numeric",
        month:"2-digit",
        day:"2-digit",
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
    }).format(date);
}
function country(value){
    const countries={LV:"Latvija",LT:"Lietuva",EE:"Igaunija",SE:"Zviedrija",FI:"Somija",NO:"Norvēģija",DK:"Dānija",PL:"Polija",DE:"Vācija",GB:"Apvienotā Karaliste",US:"Amerikas Savienotās Valstis"};
    return countries[value]||value||"—";
}

document.addEventListener("DOMContentLoaded",async()=>{
    const tableBody=document.querySelector("#participants-table tbody");
    let totalParticipants=0;
    let totalTeams=0;
    let totalEur=0;
    let total3h=0;
    let total4h=0;
    let total6h=0;

    try{
        const q=query(collection(db,"pieteikumsBrivibas2026"),orderBy("submissionTime"));
        const querySnapshot=await getDocs(q);
        let index=1;

        querySnapshot.forEach(docSnapshot=>{
            const data=docSnapshot.data();
            if(data.hide)return;
            totalTeams++;
            totalEur+=Number(data.samaksa||0);
            if(data.distance==="3h")total3h++;
            if(data.distance==="4h")total4h++;
            if(data.distance==="6h")total6h++;

            const teamRow=document.createElement("tr");
            teamRow.className="team-row";
            teamRow.innerHTML=`
                <td>${index++}</td>
                <td class="team-name">${safe(data.nosaukums)}</td>
                <td>${safe(data.distance)}</td>
                <td>${safe(data.grupa)}</td>
                <td class="municipality">${data.distance==="4h"?safe(data.pasvaldiba):"—"}</td>
                <td>${safe(data.epasts)}</td>
                <td>${safe(data.telefons)}</td>
                <td class="${data.atlaide?"discount-code":""}">${safe(data.atlaide)}</td>
                <td><strong>${money(data.samaksa)}</strong></td>
                <td>${submissionTime(data.submissionTime)}</td>`;
            tableBody.appendChild(teamRow);

            const participantRows=[];
            if(data.dalibnieki&&Array.isArray(data.dalibnieki)){
                totalParticipants+=data.dalibnieki.length;
                data.dalibnieki.forEach((participant,participantIndex)=>{
                    const participantRow=document.createElement("tr");
                    participantRow.className="participant-row";
                    participantRow.style.display="none";
                    const participantFoodChoice = participant.foodchoice ?? participant.foodChoice ?? participant.food_choice ?? participant.food ?? participant.uzturs ?? participant["food choice"] ?? participant["foodchoice"] ?? participant["foodChoice"] ?? participant["food_choice"] ?? "—";
                    const displayFoodChoice = (() => {
                        const rawValue = Array.isArray(participantFoodChoice) ? participantFoodChoice.join(", ") : String(participantFoodChoice);
                        if (rawValue === "Cits (precizēt piezīmēs)") return "cits";
                        return rawValue;
                    })();
                    participantRow.innerHTML=`
                        <td colspan="10">
                            <div class="participant-details">
                                <div>
                                    <span class="participant-label">Dalībnieks</span>
                                    <strong>${participantIndex+1}</strong>
                                </div>
                                <div>
                                    <span class="participant-label">Vārds</span>
                                    <strong>${safe(participant.vards)}</strong>
                                </div>
                                <div>
                                    <span class="participant-label">Uzvārds</span>
                                    <strong>${safe(participant.uzvards)}</strong>
                                </div>
                                <div>
                                    <span class="participant-label">Dzimšanas datums</span>
                                    ${safe(participant.birthday)}
                                </div>
                                <div>
                                    <span class="participant-label">Vecums 31.12.2026.</span>
                                    ${safe(participant.age)}
                                </div>
                                <div>
                                    <span class="participant-label">Dzimums</span>
                                    ${safe(gender(participant.dzimums))}
                                </div>
                                <div>
                                    <span class="participant-label">Valsts</span>
                                    ${safe(country(participant.country))}
                                </div>
                                <div>
                                    <span class="participant-label">Ēdiena izvēle</span>
                                    ${safe(displayFoodChoice)}
                                </div>
                                <div>
                                    <span class="participant-label">Dalības maksa</span>
                                    <strong>${money(data[`samaksa${participantIndex+1}`])}</strong>
                                </div>
                                <div>
                                    <span class="participant-label">Piezīmes</span>
                                    ${safe(participant.komentars)}
                                </div>
                            </div>
                        </td>`;
                    tableBody.appendChild(participantRow);
                    participantRows.push(participantRow);
                });
            }

            teamRow.addEventListener("click",()=>{
                const isOpen=!teamRow.classList.contains("open");
                teamRow.classList.toggle("open",isOpen);
                participantRows.forEach(row=>row.style.display=isOpen?"table-row":"none");
            });
        });

        document.getElementById("team-count").textContent=totalTeams;
        document.getElementById("participant-count").textContent=totalParticipants;
        document.getElementById("total-eur").textContent=money(totalEur);
        document.getElementById("total-3h").textContent=total3h;
        document.getElementById("total-4h").textContent=total4h;
        document.getElementById("total-6h").textContent=total6h;
    }catch(error){
        console.error("Error getting documents:",error);
    }

    document.getElementById("search-bar").addEventListener("input",function(){
        const filter=this.value.toLowerCase();
        document.querySelectorAll(".team-row").forEach(teamRow=>{
            const participantRows=[];
            let nextRow=teamRow.nextElementSibling;
            while(nextRow&&nextRow.classList.contains("participant-row")){
                participantRows.push(nextRow);
                nextRow=nextRow.nextElementSibling;
            }
            const allText=[teamRow.textContent,...participantRows.map(row=>row.textContent)].join(" ").toLowerCase();
            const matches=allText.includes(filter);
            teamRow.style.display=matches?"table-row":"none";
            if(!matches)participantRows.forEach(row=>row.style.display="none");
        });
    });
});
</script>
</head>
<body>
<h1>
    <span>
        Dalībnieku saraksts
        <span class="event-name">Brīvības rogainings 2026</span>
    </span>
    <div class="header-stats">
        <div class="stat-group">
            <div class="stat-title">Kopā</div>
            <div class="stat-line"><span>Komandas</span><span id="team-count" class="stat-value">0</span></div>
            <div class="stat-line"><span>Dalībnieki</span><span id="participant-count" class="stat-value">0</span></div>
            <div class="stat-line"><span>EUR</span><span id="total-eur" class="stat-value">0.00 EUR</span></div>
        </div>
        <div class="stat-group">
            <div class="stat-title">Distances</div>
            <div class="stat-line"><span>3h</span><span id="total-3h" class="stat-value">0</span></div>
            <div class="stat-line"><span>4h</span><span id="total-4h" class="stat-value">0</span></div>
            <div class="stat-line"><span>6h</span><span id="total-6h" class="stat-value">0</span></div>
        </div>
    </div>
</h1>
<input type="text" id="search-bar" placeholder="Meklēt…">
<div class="table-wrapper">
<table id="participants-table">
    <thead><tr><th>Nr.</th><th>Komandas nosaukums</th><th>Distance</th><th>Grupa</th><th>Pašvaldība</th><th>E-pasts</th><th>Telefons</th><th>Atlaižu kods</th><th>Kopā apmaksai</th><th>Reģistrācijas laiks</th></tr></thead>
    <tbody></tbody>
</table>
</div>
</body>
</html>
